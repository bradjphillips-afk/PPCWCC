name: Update Sweep standings

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scoring
  cancel-in-progress: false

jobs:
  score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Compute standings
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: node score.mjs

      - name: Commit & push (race-proof)
        run: |
          git config user.name "sweep-bot"
          git config user.email "actions@github.com"
          if git diff --quiet -- data/standings.json data/cards.json; then
            echo "No changes to commit."
            exit 0
          fi
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --soft origin/main
            git add data/standings.json data/cards.json
            if git diff --cached --quiet; then
              echo "Nothing new versus remote."
              exit 0
            fi
            git commit -m "Update standings $(date -u +'%Y-%m-%d %H:%M UTC')"
            if git push origin HEAD:main; then
              echo "Pushed."
              exit 0
            fi
            echo "Push raced with another run, retrying ($i)..."
            sleep $((RANDOM % 4 + 3))
          done
          echo "Failed to push after retries" >&2
          exit 1
